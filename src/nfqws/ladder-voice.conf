# Rungs of the adaptive strategy for Discord voice (UDP). The first is what every own strategy has. A
# failure: the client repeats the request of its address and gets no answer (the engine, ladder.c). One
# rung for all the voice servers. A line of nfqws options per rung.
--dpi-desync=fake --dpi-desync-fake-discord=@BASE@/bin/ACTIVE_DISCORD_UDP.bin --dpi-desync-fake-stun=@BASE@/bin/ACTIVE_DISCORD_UDP.bin --dpi-desync-repeats=6
--dpi-desync=fake --dpi-desync-fake-discord=@BASE@/bin/ACTIVE_DISCORD_UDP.bin --dpi-desync-fake-stun=@BASE@/bin/ACTIVE_DISCORD_UDP.bin --dpi-desync-repeats=12
--dpi-desync=fake --dpi-desync-fake-discord=@BASE@/bin/stun.bin --dpi-desync-fake-stun=@BASE@/bin/stun.bin --dpi-desync-repeats=6
--dpi-desync=fake,udplen --dpi-desync-udplen-increment=4 --dpi-desync-fake-discord=@BASE@/bin/ACTIVE_DISCORD_UDP.bin --dpi-desync-fake-stun=@BASE@/bin/ACTIVE_DISCORD_UDP.bin --dpi-desync-repeats=6
