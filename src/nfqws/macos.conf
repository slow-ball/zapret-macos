# Our own strategies: name|nfqws options for TCP (HTTP and HTTPS).
# The rest — QUIC, Discord voice, games — comes from the template macos/*.conf.in, as in the general strategy.
# The first nine only cut the packets, the others add fake packets.
# The order matters: at equal speed the automatic choice prefers the strategy higher in the list.

# The adaptive one is not one trick but a ladder of all of them (the engine, engine/nfq/ladder.c): every site
# climbs it while the provider breaks it, and stays on the trick that works (ladder_rungs).
Адаптивная|@LADDER@

macos|--dpi-desync=multidisorder --dpi-desync-split-pos=1,midsld
macos (ALT)|--dpi-desync=multidisorder --dpi-desync-split-pos=midsld
macos (ALT2)|--dpi-desync=multidisorder --dpi-desync-split-pos=1
macos (ALT3)|--dpi-desync=multidisorder --dpi-desync-split-pos=2,sniext+1
macos (ALT4)|--dpi-desync=multidisorder --dpi-desync-split-pos=1,sniext+1,host+1,midsld-2,midsld,midsld+2,endhost-1
macos (ALT5)|--dpi-desync=multisplit --dpi-desync-split-pos=1,midsld
macos (ALT6)|--dpi-desync=multisplit --dpi-desync-split-pos=1,sniext+1,host+1,midsld-2,midsld,midsld+2,endhost-1
macos (ALT7)|--dpi-desync=multisplit --dpi-desync-split-pos=2 --dpi-desync-split-seqovl=1
macos (ALT8)|--dpi-desync=multisplit --dpi-desync-split-pos=1 --dpi-desync-split-seqovl=681 --dpi-desync-split-seqovl-pattern=@BASE@/bin/tls_clienthello_www_google_com.bin
macos (ALT9)|--dpi-desync=fake,multidisorder --dpi-desync-split-pos=1,midsld --dpi-desync-fooling=badseq --dpi-desync-fake-tls=@BASE@/bin/tls_clienthello_www_google_com.bin
macos (ALT10)|--dpi-desync=fake,multisplit --dpi-desync-split-pos=1 --dpi-desync-fooling=md5sig --dpi-desync-fake-tls=@BASE@/bin/tls_clienthello_www_google_com.bin
macos (ALT11)|--dpi-desync=fakedsplit --dpi-desync-split-pos=midsld --dpi-desync-fooling=badseq
macos (ALT12)|--dpi-desync=fakeddisorder --dpi-desync-split-pos=midsld --dpi-desync-fooling=ts
macos (ALT13)|--dpi-desync=hostfakesplit --dpi-desync-fooling=ts --dpi-desync-hostfakesplit-mod=host=www.google.com
macos (ALT14)|--dpi-desync=fake --dpi-desync-fooling=ts --dpi-desync-repeats=6 --dpi-desync-fake-tls-mod=rnd,dupsid,sni=www.google.com
