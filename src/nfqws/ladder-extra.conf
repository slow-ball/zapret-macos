# Rungs of the adaptive strategy beyond the own strategies (macos.conf): options of the deep search that
# none of them has — other fakes and other places to cut. They come after the own ones, a line of nfqws
# options each.
--dpi-desync=fake --dpi-desync-fooling=badseq --dpi-desync-repeats=6 --dpi-desync-fake-tls=@BASE@/bin/tls_clienthello_www_google_com.bin
--dpi-desync=fake --dpi-desync-fooling=md5sig --dpi-desync-repeats=6 --dpi-desync-fake-tls-mod=rnd,dupsid,sni=www.google.com
--dpi-desync=fake,multidisorder --dpi-desync-split-pos=midsld --dpi-desync-fooling=ts --dpi-desync-fake-tls=@BASE@/bin/tls_clienthello_www_google_com.bin
--dpi-desync=fakedsplit --dpi-desync-split-pos=1,midsld --dpi-desync-fooling=md5sig
--dpi-desync=fakeddisorder --dpi-desync-split-pos=1 --dpi-desync-fooling=badseq
--dpi-desync=multisplit --dpi-desync-split-pos=sniext+1
--dpi-desync=fake,hostfakesplit --dpi-desync-fooling=badseq --dpi-desync-hostfakesplit-mod=host=www.google.com --dpi-desync-fake-tls=@BASE@/bin/tls_clienthello_www_google_com.bin
--dpi-desync=multisplit --dpi-desync-split-pos=midsld --dpi-desync-split-seqovl=1
