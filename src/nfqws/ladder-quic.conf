# Rungs of the adaptive strategy for QUIC (YouTube and other sites over UDP 443). The first is what the
# QUIC profile of every own strategy has. A failure: the client repeats its handshake and gets no answer
# (the engine, ladder.c). A line of nfqws options per rung.
--dpi-desync=fake --dpi-desync-repeats=6 --dpi-desync-fake-quic=@BASE@/bin/quic_initial_www_google_com.bin
--dpi-desync=fake --dpi-desync-repeats=11 --dpi-desync-fake-quic=@BASE@/bin/quic_initial_www_google_com.bin
--dpi-desync=fake --dpi-desync-repeats=6 --dpi-desync-fake-quic=@BASE@/bin/quic_initial_4pda_to.bin
--dpi-desync=fake,udplen --dpi-desync-repeats=6 --dpi-desync-udplen-increment=2 --dpi-desync-fake-quic=@BASE@/bin/quic_initial_www_google_com.bin
--dpi-desync=udplen --dpi-desync-udplen-increment=8
--dpi-desync=fake --dpi-desync-repeats=6 --dpi-desync-fooling=badsum --dpi-desync-fake-quic=@BASE@/bin/quic_initial_www_google_com.bin
